services:
  postgres:
    image: postgres:16
    container_name: vpnplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpnplatform}
      POSTGRES_USER: ${POSTGRES_USER:-vpnplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpnplatform} -d ${POSTGRES_DB:-vpnplatform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: vpnplatform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vpnplatform-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: vpnplatform-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    container_name: vpnplatform-grafana
    restart: unless-stopped
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3005:3000"

  loki:
    image: grafana/loki:3.0.0
    container_name: vpnplatform-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    env_file:
      - .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - provisioning-data:/tmp/vpnplatform-provisioning
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5

  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile.telegram-bot
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsOnStartup: "false"
      Database__SeedDemoData: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    ports:
      - "8081:8080"

  public-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.public-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"

  cabinet:
    build:
      context: ./frontend
      dockerfile: Dockerfile.cabinet
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_PUBLIC_WEB_URL: ${VITE_PUBLIC_WEB_URL:-http://localhost:5173}
    ports:
      - "5174:80"

  admin-panel:
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin-panel
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5175:80"

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  provisioning-data:
