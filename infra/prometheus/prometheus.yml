global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "vpnplatform-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-api:8080"]

  # backend-workers is a .NET worker service without an HTTP listener in the current architecture.
  # Do not scrape it until a dedicated worker metrics endpoint is added.

  - job_name: "vpn-nodes"
    static_configs:
      - targets: ["nl-amsterdam-01:9100"]
